<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻將戰神榜 - 雲端即時同步版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen" x-data="mahjongApp()">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🀄</span>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">麻將戰神榜</h1>
                    <p class="text-xs text-slate-400">雲端即時同步記分系統</p>
                </div>
            </div>

            <!-- 雲端房間與同步狀態 -->
            <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700 text-sm">
                <span class="text-slate-400">房間代碼:</span>
                <input type="text" x-model="tempRoomId" @change="changeRoom" class="bg-slate-800 text-blue-300 font-mono px-2 py-0.5 rounded border border-slate-600 w-32 text-center focus:outline-none focus:border-blue-500">
                <button @click="syncData" :disabled="isSyncing" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs font-medium
