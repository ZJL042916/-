<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🀄 麻將即時戰績排行榜</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f7f4ed;
            background-image: 
                radial-gradient(at 0% 0%, rgba(217, 180, 148, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(193, 154, 107, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="text-stone-800 min-h-screen p-4 md:p-8 font-sans selection:bg-amber-600 selection:text-white">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- 頂部標題與分頁切換 -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white/80 border border-stone-200/80 p-5 md:p-6 rounded-3xl shadow-xl backdrop-blur-md">
            <div class="flex items-center space-x-3.5">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-700 via-amber-600 to-yellow-600 flex items-center justify-center text-2xl text-white shadow-lg shadow-amber-900/10">
                    🀄
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-stone-900 tracking-tight">
                        麻將即時戰績排行榜
                    </h1>
                    <p class="text-xs text-stone-500 font-medium">雲端多人連線同步系統</p>
                </div>
            </div>

            <!-- 分頁切換 Tabs -->
            <div class="flex flex-wrap justify-center bg-stone-200/70 border border-stone-300/60 rounded-2xl p-1.5 shadow-inner gap-1.5">
                <button onclick="switchTab('rank')" id="tabRank" class="px-4 py-2 text-xs font-bold rounded-xl transition-all bg-amber-700 text-white shadow-md">
                    🏆 總排行榜
                </button>
                <button onclick="switchTab('monthly')" id="tabMonthly" class="px-4 py-2 text-xs font-bold rounded-xl transition-all text-stone-600 hover:text-stone-900 hover:bg-stone-300/50">
                    📅 月排行榜
                </button>
                <button onclick="switchTab('friends')" id="tabFriends" class="px-4 py-2 text-xs font-bold rounded-xl transition-all text-stone-600 hover:text-stone-900 hover:bg-stone-300/50">
                    👥 牌友管理
                </button>
            </div>
        </header>

        <!-- ==================== 分頁一：總戰績排行榜 ==================== -->
        <div id="pageRank" class="space-y-6">
            <!-- 常勝軍（最高勝率 MVP）展示區 -->
            <div id="mvpBanner" class="bg-gradient-to-r from-amber-50/90 via-white to-orange-50/90 border border-amber-200 rounded-3xl p-6 shadow-xl backdrop-blur-md flex items-center justify-between relative overflow-hidden hidden">
                <div class="absolute -right-6 -bottom-6 text-9xl text-amber-900/5 pointer-events-none font-black select-none">MVP</div>
                <div class="flex items-center space-x-4 relative z-10">
                    <div class="w-14 h-14 rounded-2xl bg-amber-100 border border-amber-300 flex items-center justify-center text-3xl shadow-inner">
                        👑
                    </div>
                    <div>
                        <div class="text-xs text-amber-800 font-bold tracking-widest uppercase">總榜常勝軍 (最高勝率 MVP)</div>
                        <div id="mvpName" class="text-xl md:text-2xl font-black text-stone-900 mt-0.5 tracking-wide">-</div>
                    </div>
                </div>
                <div class="text-right relative z-10">
                    <div id="mvpRate" class="text-2xl md:text-3xl font-black text-amber-700">-</div>
                    <div class="text-xs text-stone-500 font-semibold tracking-wider">勝率</div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 左側：新增對局表單 -->
                <div class="bg-white/80 border border-stone-200/80 rounded-3xl p-6 shadow-xl backdrop-blur-md md:col-span-1">
                    <h2 class="text-base font-bold text-amber-800 mb-5 flex items-center gap-2">
                        <span class="p-1.5 bg-amber-100 rounded-xl border border-amber-200">📝</span> 記錄新牌局
                    </h2>
                    <form id="gameForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-stone-600 mb-1.5">牌局日期</label>
                            <input type="date" id="gameDate" class="w-full bg-stone-50 border border-stone-300 rounded-2xl px-4 py-2.5 text-sm text-stone-800 focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/20 transition-all shadow-inner" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-stone-600 mb-1.5">地點</label>
                            <input type="text" id="location" value="新北市板橋區" class="w-full bg-stone-50 border border-stone-300 rounded-2xl px-4 py-2.5 text-sm text-stone-800 focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/20 transition-all shadow-inner" required>
                        </div>
                        
                        <div class="space-y-3 pt-1">
                            <div class="grid grid-cols-2 gap-2.5">
                                <div class="space-y-1">
                                    <label class="block text-[11px] font-semibold text-stone-600">玩家 1 (東)</label>
                                    <select id="p1Name" class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs text-stone-800 focus:outline-none focus:border-amber-600" required></select>
                                    <input type="number" id="p1Score" placeholder="得分" value="500" class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs text-emerald-700 font-bold focus:outline-none focus:border-emerald-600 shadow-inner" required>
                                </div>
                                <div class="space-y-1">
                                    <label class="block text-[11px] font-semibold text-stone-600">玩家 2 (南)</label>
                                    <select id="p2Name" class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs text-stone-800 focus:outline-none focus:border-amber-600" required></select>
                                    <input type="number" id="p2Score" placeholder="得分" value="-100" class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs text-rose-700 font-bold focus:outline-none focus:border-rose-600 shadow-inner" required>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2.5">
                                <div class="space-y-1">
                                    <label class="block text-[11px] font-semibold text-stone-600">玩家 3 (西)</label>
                                    <select id="p3Name" class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs text-stone-800 focus:outline-none focus:border-amber-600" required></select>
                                    <input type="number" id="p3Score" placeholder="得分" value="-200" class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs text-rose-700 font-bold focus:outline-none focus:border-rose-600 shadow-inner" required>
                                </div>
                                <div class="space-y-1">
                                    <label class="block text-[11px] font-semibold text-stone-600">玩家 4 (北)</label>
                                    <select id="p4Name" class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs text-stone-800 focus:outline-none focus:border-amber-600" required></select>
                                    <input type="number" id="p4Score" placeholder="得分" value="-200" class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-xs text-rose-700 font-bold focus:outline-none focus:border-rose-600 shadow-inner" required>
                                </div>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="w-full mt-2 bg-gradient-to-r from-amber-700 to-amber-600 hover:from-amber-800 hover:to-amber-700 text-white font-bold py-3.5 rounded-2xl transition-all shadow-lg shadow-amber-900/20 text-sm active:scale-[0.98]">
                            新增戰績並存入雲端
                        </button>
                    </form>
                </div>

                <!-- 右側：排行榜表格 -->
                <div class="bg-white/80 border border-stone-200/80 rounded-3xl shadow-xl backdrop-blur-md md:col-span-2 flex flex-col overflow-hidden">
                    <div class="p-5 md:p-6 border-b border-stone-200 flex justify-between items-center bg-stone-50/50">
                        <h2 class="text-base font-bold text-amber-800 flex items-center gap-2">
                            <span class="p-1.5 bg-amber-100 rounded-xl border border-amber-200">🏆</span> 總累積戰績排行榜
                        </h2>
                        <button onclick="loadData()" class="text-xs font-semibold bg-stone-200/80 hover:bg-stone-300 text-stone-700 px-4 py-2.5 rounded-xl border border-stone-300 transition-all flex items-center gap-1.5 active:scale-95 shadow-sm">
                            <span>🔄</span> 重新整理
                        </button>
                    </div>
                    <div class="overflow-x-auto flex-1 p-5 md:p-6">
                        <div id="loading" class="text-center text-stone-500 py-16 text-sm flex flex-col items-center gap-2">
                            <div class="w-6 h-6 border-2 border-amber-700 border-t-transparent rounded-full animate-spin"></div>
                            正在從 Google 雲端載入資料...
                        </div>
                        <table class="w-full text-left border-collapse hidden" id="rankTable">
                            <thead>
                                <tr class="border-b border-stone-200 text-stone-500 text-xs uppercase tracking-wider">
                                    <th class="py-3 px-4 font-bold">排名</th>
                                    <th class="py-3 px-4 font-bold">牌友</th>
                                    <th class="py-3 px-4 font-bold text-center">總場次</th>
                                    <th class="py-3 px-4 font-bold text-center">勝率</th>
                                    <th class="py-3 px-4 font-bold text-right">累積得分</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboardBody" class="divide-y divide-stone-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 分頁二：月排行榜 ==================== -->
        <div id="pageMonthly" class="space-y-6 hidden">
            <!-- 月份選擇控制列 -->
            <div class="bg-white/80 border border-stone-200/80 rounded-3xl p-5 md:p-6 shadow-xl backdrop-blur-md flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3.5">
                    <div class="w-11 h-11 rounded-2xl bg-amber-100 border border-amber-200 flex items-center justify-center text-xl">
                        📅
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-amber-800">月度戰績統計</h2>
                        <p class="text-xs text-stone-500">檢視指定月份的勝率與積分表現</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <input type="month" id="selectMonth" onchange="renderMonthlyLeaderboard()" class="bg-stone-50 border border-stone-300 rounded-2xl px-4 py-2.5 text-sm text-stone-800 focus:outline-none focus:border-amber-600 font-semibold shadow-inner">
                </div>
            </div>

            <!-- 當月 MVP 與排行榜 -->
            <div class="bg-white/80 border border-stone-200/80 rounded-3xl shadow-xl backdrop-blur-md overflow-hidden">
                <div id="monthMvpBanner" class="bg-gradient-to-r from-amber-50/80 via-white to-orange-50/80 border-b border-stone-200 p-5 md:p-6 flex items-center justify-between hidden">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-10 h-10 rounded-xl bg-amber-100 border border-amber-300 flex items-center justify-center text-xl">
                            🎖️
                        </div>
                        <div>
                            <div class="text-xs text-amber-800 font-bold uppercase tracking-wider">本月當月 MVP</div>
                            <div id="monthMvpName" class="text-lg font-bold text-stone-900 mt-0.5">-</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div id="monthMvpRate" class="text-xl font-black text-amber-700">-</div>
                        <div class="text-xs text-stone-500 font-medium">勝率</div>
                    </div>
                </div>

                <div class="p-5 md:p-6 overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-stone-200 text-stone-500 text-xs uppercase tracking-wider">
                                <th class="py-3 px-4 font-bold">排名</th>
                                <th class="py-3 px-4 font-bold">牌友</th>
                                <th class="py-3 px-4 font-bold text-center">當月場次</th>
                                <th class="py-3 px-4 font-bold text-center">當月勝率</th>
                                <th class="py-3 px-4 font-bold text-right">當月得分</th>
                            </tr>
                        </thead>
                        <tbody id="monthlyLeaderboardBody" class="divide-y divide-stone-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ==================== 分頁三：牌友與綽號管理 ==================== -->
        <div id="pageFriends" class="space-y-6 hidden">
            <div class="bg-white/80 border border-stone-200/80 rounded-3xl p-6 md:p-8 shadow-xl backdrop-blur-md max-w-xl mx-auto">
                <h2 class="text-base font-bold text-amber-800 mb-5 flex items-center gap-2">
                    <span class="p-1.5 bg-amber-100 rounded-xl border border-amber-200">👥</span> 新增牌友與專屬綽號 (雲端同步)
                </h2>
                <form id="friendForm" class="space-y-4 mb-6">
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 mb-1.5">牌友姓名</label>
                        <input type="text" id="friendName" placeholder="例如：張嘉恩" class="w-full bg-stone-50 border border-stone-300 rounded-2xl px-4 py-2.5 text-sm text-stone-800 focus:outline-none focus:border-amber-600 shadow-inner transition-colors" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 mb-1.5">專屬綽號</label>
                        <input type="text" id="friendNickname" placeholder="例如：二頭肌" class="w-full bg-stone-50 border border-stone-300 rounded-2xl px-4 py-2.5 text-sm text-stone-800 focus:outline-none focus:border-amber-600 shadow-inner transition-colors" required>
                    </div>
                    <button type="submit" id="friendSubmitBtn" class="w-full bg-gradient-to-r from-amber-700 to-amber-600 hover:from-amber-800 hover:to-amber-700 text-white font-bold py-3.5 rounded-2xl transition-all shadow-lg shadow-amber-900/20 text-sm active:scale-[0.98]">
                        儲存牌友至雲端
                    </button>
                </form>

                <h3 class="text-xs uppercase tracking-wider text-stone-500 font-bold mb-3">雲端現有牌友與綽號清單</h3>
                <div class="overflow-x-auto rounded-2xl border border-stone-200 shadow-inner bg-stone-50/50">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-stone-100 border-b border-stone-200 text-stone-500 text-xs">
                                <th class="py-3 px-4 font-bold">姓名</th>
                                <th class="py-3 px-4 font-bold">綽號</th>
                                <th class="py-3 px-4 font-bold text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="friendTableBody" class="divide-y divide-stone-200/60"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz3c7X_Amn2wfe02Esonpr6YSDHnrldCdnh2fjq_AZyIgteFi--nO5XUYHwHCjVt4B9/exec";

        let games = [];
        let friendsData = [];

        function setDefaultDates() {
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('gameDate');
            if (dateInput && !dateInput.value) dateInput.value = today;

            const monthInput = document.getElementById('selectMonth');
            if (monthInput && !monthInput.value) {
                monthInput.value = today.slice(0, 7);
            }
        }
        setDefaultDates();

        function updatePlayerSelects() {
            const selects = ['p1Name', 'p2Name', 'p3Name', 'p4Name'];
            selects.forEach((id) => {
                const select = document.getElementById(id);
                if (!select) return;
                const currentVal = select.value;
                select.innerHTML = '';
                
                if (friendsData.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = "";
                    opt.innerText = "請先至「牌友管理」新增牌友";
                    select.appendChild(opt);
                    return;
                }

                friendsData.forEach((f) => {
                    const display = `${f.name} (${f.nickname})`;
                    const opt = document.createElement('option');
                    opt.value = display;
                    opt.innerText = display;
                    select.appendChild(opt);
                });
                if (currentVal) select.value = currentVal;
            });
        }

        function switchTab(tab) {
            const pageRank = document.getElementById('pageRank');
            const pageMonthly = document.getElementById('pageMonthly');
            const pageFriends = document.getElementById('pageFriends');
            
            const tabRank = document.getElementById('tabRank');
            const tabMonthly = document.getElementById('tabMonthly');
            const tabFriends = document.getElementById('tabFriends');

            if (!pageRank || !pageMonthly || !pageFriends) return;

            pageRank.classList.add('hidden');
            pageMonthly.classList.add('hidden');
            pageFriends.classList.add('hidden');

            const inactiveClass = "px-4 py-2 text-xs font-bold rounded-xl transition-all text-stone-600 hover:text-stone-900 hover:bg-stone-300/50";
            if(tabRank) tabRank.className = inactiveClass;
            if(tabMonthly) tabMonthly.className = inactiveClass;
            if(tabFriends) tabFriends.className = inactiveClass;

            if (tab === 'rank') {
                pageRank.classList.remove('hidden');
                if(tabRank) tabRank.className = "px-4 py-2 text-xs font-bold rounded-xl transition-all bg-amber-700 text-white shadow-md";
                updatePlayerSelects();
            } else if (tab === 'monthly') {
                pageMonthly.classList.remove('hidden');
                if(tabMonthly) tabMonthly.className = "px-4 py-2 text-xs font-bold rounded-xl transition-all bg-amber-700 text-white shadow-md";
                renderMonthlyLeaderboard();
            } else {
                pageFriends.classList.remove('hidden');
                if(tabFriends) tabFriends.className = "px-4 py-2 text-xs font-bold rounded-xl transition-all bg-amber-700 text-white shadow-md";
                renderFriendsTable();
            }
        }

        async function loadData() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('rankTable');
            if (!loading || !table) return;
            loading.style.display = 'block';
            table.classList.add('hidden');

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                const response = await fetch(WEB_APP_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                const data = await response.json();
                games = data.games || [];
                friendsData = data.friends || [];

                updatePlayerSelects();
                renderLeaderboard();
                renderMonthlyLeaderboard();
                renderFriendsTable();

                loading.style.display = 'none';
                table.classList.remove('hidden');
            } catch (error) {
                console.error('讀取雲端資料失敗:', error);
                loading.innerHTML = `
                    <div class="text-rose-600 font-semibold mb-2">⚠️ 無法順利連接至 Google 雲端</div>
                    <div class="text-xs text-stone-500 mb-4">請確認網路狀態或 Apps Script 部署</div>
                    <button onclick="loadData()" class="px-4 py-2 bg-amber-700 text-white text-xs font-bold rounded-xl shadow">重新嘗試載入</button>
                `;
            }
        }

        function renderLeaderboard() {
            const stats = {};
            games.forEach(g => {
                if (!g.scores) return;
                Object.entries(g.scores).forEach(([name, score]) => {
                    if (!stats[name]) stats[name] = { totalScore: 0, totalGames: 0, wins: 0 };
                    stats[name].totalScore += Number(score);
                    stats[name].totalGames += 1;
                    if (Number(score) > 0) stats[name].wins += 1;
                });
            });

            const sorted = Object.entries(stats).sort(([,a], [,b]) => {
                if (b.totalScore !== a.totalScore) return b.totalScore - a.totalScore;
                const rateA = a.totalGames ? (a.wins / a.totalGames) : 0;
                const rateB = b.totalGames ? (b.wins / b.totalGames) : 0;
                return rateB - rateA;
            });

            let mvp = null;
            let highestRate = -1;
            Object.entries(stats).forEach(([name, data]) => {
                if (data.totalGames > 0) {
                    const rate = data.wins / data.totalGames;
                    if (rate > highestRate) {
                        highestRate = rate;
                        mvp = { name, rate: Math.round(rate * 100), totalGames: data.totalGames };
                    }
                }
            });

            const mvpBanner = document.getElementById('mvpBanner');
            if (mvpBanner && mvp && mvp.totalGames >= 1) {
                document.getElementById('mvpName').innerText = mvp.name;
                document.getElementById('mvpRate').innerText = `${mvp.rate}%`;
                mvpBanner.classList.remove('hidden');
            } else if (mvpBanner) {
                mvpBanner.classList.add('hidden');
            }

            const tbody = document.getElementById('leaderboardBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (sorted.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-stone-400 font-medium">目前尚無戰績資料，快去新增一局吧！</td></tr>`;
                return;
            }

            sorted.forEach(([name, data], idx) => {
                const winRate = data.totalGames ? Math.round((data.wins / data.totalGames) * 100) : 0;
                const scoreClass = data.totalScore >= 0 ? 'text-emerald-700 font-bold' : 'text-rose-700 font-bold';
                const scoreText = data.totalScore > 0 ? `+${data.totalScore}` : data.totalScore;
                const rankBadge = idx === 0 ? 'text-amber-600 font-black' : idx === 1 ? 'text-stone-500 font-bold' : idx === 2 ? 'text-amber-800 font-bold' : 'text-stone-400';

                tbody.innerHTML += `
                    <tr class="hover:bg-stone-50/80 transition-colors">
                        <td class="py-4 px-4 font-semibold ${rankBadge}">#${idx + 1}</td>
                        <td class="py-4 px-4 font-semibold text-stone-900">${name}</td>
                        <td class="py-4 px-4 text-center text-stone-600">${data.totalGames}</td>
                        <td class="py-4 px-4 text-center text-stone-600">${winRate}%</td>
                        <td class="py-4 px-4 text-right ${scoreClass}">${scoreText}</td>
                    </tr>
                `;
            });
        }

        function renderMonthlyLeaderboard() {
            const monthInput = document.getElementById('selectMonth');
            if (!monthInput) return;
            const selectedMonth = monthInput.value;
            if (!selectedMonth) return;

            const stats = {};
            games.forEach(g => {
                if (!g.timestamp || !g.scores) return;
                if (g.timestamp.startsWith(selectedMonth)) {
                    Object.entries(g.scores).forEach(([name, score]) => {
                        if (!stats[name]) stats[name] = { totalScore: 0, totalGames: 0, wins: 0 };
                        stats[name].totalScore += Number(score);
                        stats[name].totalGames += 1;
                        if (Number(score) > 0) stats[name].wins += 1;
                    });
                }
            });

            const sorted = Object.entries(stats).sort(([,a], [,b]) => {
                if (b.totalScore !== a.totalScore) return b.totalScore - a.totalScore;
                const rateA = a.totalGames ? (a.wins / a.totalGames) : 0;
                const rateB = b.totalGames ? (b.wins / b.totalGames) : 0;
                return rateB - rateA;
            });

            let monthMvp = null;
            let highestRate = -1;
            Object.entries(stats).forEach(([name, data]) => {
                if (data.totalGames > 0) {
                    const rate = data.wins / data.totalGames;
                    if (rate > highestRate) {
                        highestRate = rate;
                        monthMvp = { name, rate: Math.round(rate * 100), totalGames: data.totalGames };
                    }
                }
            });

            const monthMvpBanner = document.getElementById('monthMvpBanner');
            if (monthMvpBanner && monthMvp && monthMvp.totalGames >= 1) {
                document.getElementById('monthMvpName').innerText = monthMvp.name;
                document.getElementById('monthMvpRate').innerText = `${monthMvp.rate}%`;
                monthMvpBanner.classList.remove('hidden');
            } else if (monthMvpBanner) {
                monthMvpBanner.classList.add('hidden');
            }

            const tbody = document.getElementById('monthlyLeaderboardBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (sorted.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-stone-400 font-medium">${selectedMonth} 無任何牌局記錄</td></tr>`;
                return;
            }

            sorted.forEach(([name, data], idx) => {
                const winRate = data.totalGames ? Math.round((data.wins / data.totalGames) * 100) : 0;
                const scoreClass = data.totalScore >= 0 ? 'text-emerald-700 font-bold' : 'text-rose-700 font-bold';
                const scoreText = data.totalScore > 0 ? `+${data.totalScore}` : data.totalScore;
                const rankBadge = idx === 0 ? 'text-amber-600 font-black' : idx === 1 ? 'text-stone-500 font-bold' : idx === 2 ? 'text-amber-800 font-bold' : 'text-stone-400';

                tbody.innerHTML += `
                    <tr class="hover:bg-stone-50/80 transition-colors">
                        <td class="py-4 px-4 font-semibold ${rankBadge}">#${idx + 1}</td>
                        <td class="py-4 px-4 font-semibold text-stone-900">${name}</td>
                        <td class="py-4 px-4 text-center text-stone-600">${data.totalGames}</td>
                        <td class="py-4 px-4 text-center text-stone-600">${winRate}%</td>
                        <td class="py-4 px-4 text-right ${scoreClass}">${scoreText}</td>
                    </tr>
                `;
            });
        }

        // 渲染牌友表格（將刪除按鈕改為修改，並顯示修改時間）
        function renderFriendsTable() {
            const fTable = document.getElementById('friendTableBody');
            if (!fTable) return;
            fTable.innerHTML = '';
            if (friendsData.length === 0) {
                fTable.innerHTML = `<tr><td colspan="3" class="text-center py-8 text-stone-400 font-medium">目前尚無牌友資料，請在上方新增</td></tr>`;
                return;
            }
            friendsData.forEach((f, idx) => {
                fTable.innerHTML += `
                    <tr class="hover:bg-stone-100/80 transition-colors">
                        <td class="py-3.5 px-4 font-semibold text-stone-900">
                            ${f.name}
                            <div class="text-[10px] text-stone-400 font-normal">更新: ${f.updatedAt || '初次建立'}</div>
                        </td>
                        <td class="py-3.5 px-4 text-amber-700 font-semibold">${f.nickname}</td>
                        <td class="py-3.5 px-4 text-right">
                            <button onclick="editFriend(${idx})" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-800 px-3 py-1.5 rounded-xl border border-amber-200 transition-all font-semibold">修改</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function syncFriendsToCloud() {
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: "UPDATE_FRIENDS", friends: friendsData })
                });
            } catch (error) {
                console.error('牌友名單同步雲端失敗:', error);
            }
        }

        // 新增牌友（含防呆與時間戳）
        document.getElementById('friendForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('friendName');
            const nicknameInput = document.getElementById('friendNickname');
            if(!nameInput || !nicknameInput) return;

            const name = nameInput.value.trim();
            const nickname = nicknameInput.value.trim();
            
            const exists = friendsData.some(f => f.name === name);
            if (exists) {
                alert(`⚠️ 牌友新增失敗：名字「${name}」已經存在清單中了！若要更改請點擊右側「修改」。`);
                return;
            }

            if (name && nickname) {
                const btn = document.getElementById('friendSubmitBtn');
                btn.innerText = '正在同步至雲端...';
                btn.disabled = true;

                const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });
                friendsData.push({ name, nickname, updatedAt: nowStr });
                await syncFriendsToCloud();

                nameInput.value = '';
                nicknameInput.value = '';
                renderFriendsTable();
                updatePlayerSelects();
                
                btn.innerText = '儲存牌友至雲端';
                btn.disabled = false;
                alert(`成功新增並同步牌友：${name} (${nickname})`);
            }
        });

        // 修改牌友綽號功能
        async function editFriend(index) {
            const f = friendsData[index];
            const newNickname = prompt(`請輸入「${f.name}」的新綽號：`, f.nickname);
            if (newNickname !== null) {
                const trimmed = newNickname.trim();
                if (trimmed) {
                    f.nickname = trimmed;
                    f.updatedAt = new Date().toLocaleString('zh-TW', { hour12: false });
                    await syncFriendsToCloud();
                    renderFriendsTable();
                    updatePlayerSelects();
                    alert(`已成功更新「${f.name}」的綽號與修改時間！`);
                } else {
                    alert('綽號不能為空！');
                }
            }
        }

        // 提交新戰績
        document.getElementById('gameForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (friendsData.length < 4) {
                alert('⚠️ 系統提示：牌友名單至少需要有 4 位才能記錄牌局，請先至「牌友管理」新增！');
                return;
            }

            const p1 = document.getElementById('p1Name').value;
            const p2 = document.getElementById('p2Name').value;
            const p3 = document.getElementById('p3Name').value;
            const p4 = document.getElementById('p4Name').value;

            const players = [p1, p2, p3, p4];
            const uniquePlayers = new Set(players);
            if (uniquePlayers.size !== players.length) {
                alert('⚠️ 記分防呆：四位玩家不能有重複的人選，請重新選擇！');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = '正在上傳至雲端...';
            btn.disabled = true;

            const newGame = {
                timestamp: document.getElementById('gameDate').value,
                location: document.getElementById('location').value,
                p1Name: p1,
                p1Score: document.getElementById('p1Score').value,
                p2Name: p2,
                p2Score: document.getElementById('p2Score').value,
                p3Name: p3,
                p3Score: document.getElementById('p3Score').value,
                p4Name: p4,
                p4Score: document.getElementById('p4Score').value,
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newGame)
                });

                alert('戰績已成功同步至 Google 雲端！');
                document.getElementById('gameForm').reset();
                setDefaultDates();
                updatePlayerSelects();
                setTimeout(loadData, 1500);
            } catch (error) {
                console.error('上傳失敗:', error);
                alert('上傳失敗請稍後再試。');
            } finally {
                btn.innerText = '新增戰績並存入雲端';
                btn.disabled = false;
            }
        });

        loadData();
    </script>
</body>
</html>
