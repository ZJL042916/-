<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🀄 麻將即時戰績排行榜</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- 標題區 -->
        <header class="mb-8 border-b border-slate-800 pb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-sky-200 bg-clip-text text-transparent">
                🀄 麻將即時戰績排行榜
            </h1>
            <span class="text-xs px-3 py-1 bg-blue-900/50 text-blue-300 rounded-full border border-blue-700/50">
                ☁️ Google 雲端同步中
            </span>
        </header>

        <!-- 常勝軍（最高勝率 MVP）展示區 -->
        <div id="mvpBanner" class="mb-6 bg-gradient-to-r from-blue-900/40 via-slate-900 to-sky-900/40 border border-blue-500/30 rounded-2xl p-5 shadow-xl backdrop-blur-md flex items-center justify-between hidden">
            <div class="flex items-center space-x-4">
                <div class="text-3xl">👑</div>
                <div>
                    <div class="text-xs text-blue-400 font-semibold tracking-wider uppercase">本週常勝軍 (最高勝率 MVP)</div>
                    <div id="mvpName" class="text-xl font-bold text-white mt-0.5">-</div>
                </div>
            </div>
            <div class="text-right">
                <div id="mvpRate" class="text-2xl font-black text-sky-400">-</div>
                <div class="text-xs text-slate-400">勝率</div>
            </div>
        </div>

        <!-- 主體內容 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- 左側：新增對局表單 -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur-md md:col-span-1">
                <h2 class="text-lg font-semibold text-blue-400 mb-4">📝 記錄新牌局</h2>
                <form id="gameForm" class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">牌局時間</label>
                        <input type="datetime-local" id="gameTime" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">地點</label>
                        <input type="text" id="location" value="新北市板橋區" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500" required>
                    </div>
                    
                    <div class="space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">玩家 1 (東)</label>
                                <input type="text" id="p1Name" value="張嘉恩" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200" required>
                                <input type="number" id="p1Score" placeholder="得分" value="500" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-emerald-400 font-bold" required>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">玩家 2 (南)</label>
                                <input type="text" id="p2Name" value="小頭" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200" required>
                                <input type="number" id="p2Score" placeholder="得分" value="-100" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-rose-400 font-bold" required>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">玩家 3 (西)</label>
                                <input type="text" id="p3Name" value="牌友A" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200" required>
                                <input type="number" id="p3Score" placeholder="得分" value="-200" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-rose-400 font-bold" required>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">玩家 4 (北)</label>
                                <input type="text" id="p4Name" value="牌友B" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200" required>
                                <input type="number" id="p4Score" placeholder="得分" value="-200" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-rose-400 font-bold" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm shadow-lg shadow-blue-600/20">
                        新增戰績並存入雲端
                    </button>
                </form>
            </div>

            <!-- 右側：排行榜與歷史表格 -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl shadow-xl overflow-hidden backdrop-blur-md md:col-span-2 flex flex-col">
                <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-blue-400">🏆 雲端累積戰績排行榜</h2>
                    <button onclick="loadGames()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
                        🔄 重新整理戰績
                    </button>
                </div>
                <div class="overflow-x-auto flex-1 p-6">
                    <div id="loading" class="text-center text-slate-400 py-8">正在從 Google 雲端載入戰績...</div>
                    <table class="w-full text-left border-collapse hidden" id="rankTable">
                        <thead>
                            <tr class="bg-slate-800/60 text-slate-400 text-xs uppercase tracking-wider">
                                <th class="py-3 px-4">排名</th>
                                <th class="py-3 px-4">牌友</th>
                                <th class="py-3 px-4 text-center">總場次</th>
                                <th class="py-3 px-4 text-center">勝率</th>
                                <th class="py-3 px-4 text-right">累積得分</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody" class="divide-y divide-slate-800/60 text-sm">
                            <!-- 動態載入 -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 💡 記得保留你原本的 Google Apps Script 網址
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz3c7X_Amn2wfe02Esonpr6YSDHnrldCdnh2fjq_AZyIgteFi--nO5XUYHwHCjVt4B9/exec";

        let games = [];

        // 自動將時間欄位填入當前本地時間
        function setDefaultDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('gameTime').value = now.toISOString().slice(0, 16);
        }
        setDefaultDateTime();

        // 1. 從 Google 試算表讀取資料
        async function loadGames() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('rankTable');
            loading.style.display = 'block';
            table.classList.add('hidden');

            try {
                const response = await fetch(WEB_APP_URL);
                games = await response.json();
                renderLeaderboard();
                loading.style.display = 'none';
                table.classList.remove('hidden');
            } catch (error) {
                console.error('讀取失敗:', error);
                loading.innerText = '載入失敗，請檢查網路或 API 網址是否正確。';
            }
        }

        // 2. 渲染排行榜與常勝軍 (MVP) 畫面
        function renderLeaderboard() {
            const stats = {};
            games.forEach(g => {
                if (!g.scores) return;
                Object.entries(g.scores).forEach(([name, score]) => {
                    if (!stats[name]) stats[name] = { totalScore: 0, totalGames: 0, wins: 0 };
                    stats[name].totalScore += Number(score);
                    stats[name].totalGames += 1;
                    if (Number(score) > 0) stats[name].wins += 1;
                });
            });

            // 排序：先比總得分，總得分一樣比勝率
            const sorted = Object.entries(stats).sort(([,a], [,b]) => {
                if (b.totalScore !== a.totalScore) return b.totalScore - a.totalScore;
                const rateA = a.totalGames ? (a.wins / a.totalGames) : 0;
                const rateB = b.totalGames ? (b.wins / b.totalGames) : 0;
                return rateB - rateA;
            });

            // 計算常勝軍 MVP（至少打過 1 場且勝率最高）
            let mvp = null;
            let highestRate = -1;
            Object.entries(stats).forEach(([name, data]) => {
                if (data.totalGames > 0) {
                    const rate = data.wins / data.totalGames;
                    if (rate > highestRate) {
                        highestRate = rate;
                        mvp = { name, rate: Math.round(rate * 100), totalGames: data.totalGames };
                    }
                }
            });

            // 顯示或隱藏 MVP 橫幅
            const mvpBanner = document.getElementById('mvpBanner');
            if (mvp && mvp.totalGames >= 1) {
                document.getElementById('mvpName').innerText = mvp.name;
                document.getElementById('mvpRate').innerText = `${mvp.rate}%`;
                mvpBanner.classList.remove('hidden');
            } else {
                mvpBanner.classList.add('hidden');
            }

            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            if (sorted.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500">目前尚無戰績資料，快在左側新增一局吧！</td></tr>`;
                return;
            }

            sorted.forEach(([name, data], idx) => {
                const winRate = data.totalGames ? Math.round((data.wins / data.totalGames) * 100) : 0;
                const scoreClass = data.totalScore >= 0 ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold';
                const scoreText = data.totalScore > 0 ? `+${data.totalScore}` : data.totalScore;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/30 transition-colors">
                        <td class="py-3 px-4 font-semibold text-sky-400">#${idx + 1}</td>
                        <td class="py-3 px-4 font-medium text-white">${name}</td>
                        <td class="py-3 px-4 text-center text-slate-300">${data.totalGames}</td>
                        <td class="py-3 px-4 text-center text-slate-300">${winRate}%</td>
                        <td class="py-3 px-4 text-right ${scoreClass}">${scoreText}</td>
                    </tr>
                `;
            });
        }

        // 3. 提交新戰績到 Google 試算表
        document.getElementById('gameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = '正在上傳至雲端...';
            btn.disabled = true;

            const newGame = {
                timestamp: document.getElementById('gameTime').value,
                location: document.getElementById('location').value,
                p1Name: document.getElementById('p1Name').value,
                p1Score: document.getElementById('p1Score').value,
                p2Name: document.getElementById('p2Name').value,
                p2Score: document.getElementById('p2Score').value,
                p3Name: document.getElementById('p3Name').value,
                p3Score: document.getElementById('p3Score').value,
                p4Name: document.getElementById('p4Name').value,
                p4Score: document.getElementById('p4Score').value,
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newGame)
                });

                alert('戰績已成功同步至 Google 雲端！');
                document.getElementById('gameForm').reset();
                setDefaultDateTime();
                setTimeout(loadGames, 1500);
            } catch (error) {
                console.error('上傳失敗:', error);
                alert('上傳失敗請稍後再試。');
            } finally {
                btn.innerText = '新增戰績並存入雲端';
                btn.disabled = false;
            }
        });

        loadGames();
    </script>
</body>
</html>
